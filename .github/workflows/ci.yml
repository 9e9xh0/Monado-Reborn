name: ci
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # no game data and no upstream trees are needed for these tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no game data)
        run: python -X utf8 -W error::ResourceWarning -m unittest discover -s tests/unit -v
      - name: Documentation links and paths
        run: python -X utf8 tools/check_docs.py
      - name: Repo path literals in build, CI and tooling files
        if: runner.os == 'Linux'
        run: python -X utf8 tools/check_paths.py
      - name: Packaging guard over tracked files (Constitution art. I)
        run: python -X utf8 tools/package/package_guard.py --git .
  windows-components:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Project-local compiler and test dependencies (no game data)
        run: python -m pip install --target build/toolchain ziglang==0.17.1 capstone==5.0.9 lz4==4.4.5 unicorn==2.1.4
      - name: Official project-local validation SDK
        run: python tools/diag/setup_validation.py
      - name: Windows runtime components, launcher and native regressions
        run: python tools/diag/validate_port.py --build-ui
  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install native test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libvulkan-dev libvulkan-memory-allocator-dev libshaderc-dev
      - name: Run Linux native tests (no game data)
        run: bash scripts/native_tests_linux.sh
